version: '3.8'

services:

  # --- API Layer ---
  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      # Networking Overrides
      - MONGODB_URI=mongodb://mongo:27017/meeting-assistant
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLIENT_URL=https://www.minutemaker.tech
      - STT_SERVICE_URL=http://utilities:5001
    depends_on:
      - mongo
      - redis
      - utilities

  # --- AI/Utility Layer ---
  utilities:
    build: ./utilities
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - ./utilities:/app
      - ./RAG_DATA:/app/RAG_DATA # Mount data for processing
    env_file:
      - ./utilities/.env
    environment:
      - FLASK_ENV=development
    # GPU requirements removed for standard Droplet deployment
    
  # --- Data Layer ---
  mongo:
    image: mongo:latest
    restart: always
    # Removed public port - only accessible within Docker network
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes
    # Removed public port - only accessible within Docker network
    volumes:
      - redis_data:/data

  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8081'
      - --scheme
      - http
    image: semitechnologies/weaviate:1.24.1
    restart: always
    # Removed public ports - only accessible within Docker network
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none' # We use local embeddings
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'

volumes:
  mongo_data:
  weaviate_data:
  redis_data:
